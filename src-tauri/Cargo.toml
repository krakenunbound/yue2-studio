[package]
name = "yue2-studio"
version = "0.6.1"
description = "A native YuE2 production studio"
authors = ["The Kraken"]
edition = "2021"

[lib]
name = "yue2_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ureq = "2"
